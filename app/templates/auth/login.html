{% extends "base.html" %}
{% block title %}Log in | Gardevoir{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>Welcome back</h1>
    <p>Log in to post and manage your items.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Log in</button>
    </form>
    <p class="form-footer">New here? <a href="{{ url_for('auth.register', next=request.values.get('next')) }}">Create an account</a>.</p>
  </section>
{% endblock %}
