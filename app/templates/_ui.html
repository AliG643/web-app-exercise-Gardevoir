{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'search' %}
<circle cx="10.8" cy="10.8" r="6.8"/>
<path d="m16 16 4.5 4.5"/>
{% elif name == 'plus' %}
<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow' %}
<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'back' %}
<path d="M19 12H5m6-6-6 6 6 6"/>
{% elif name == 'image' %}
<rect x="3" y="3" width="18" height="18" rx="3"/>
<circle cx="8.5" cy="8.5" r="1.5"/>
<path d="m21 15-5-5L6 21"/>
{% elif name == 'sort' %}
<path d="M8 4v16m-4-4 4 4 4-4m4-12v16m-4-12 4-4 4 4"/>
{% elif name == 'close' %}
<path d="m6 6 12 12M18 6 6 18"/>
{% elif name == 'cycle' %}
<path d="M20 8a8 8 0 0 0-13-3L3 8m0-5v5h5M4 16a8 8 0 0 0 13 3l4-3m0 5v-5h-5"/>
{% elif name == 'check' %}
<path d="m5 12 4 4L19 6"/>
{% elif name == 'alert' %}
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v6m0 4h.01"/>
{% endif %}
</svg>
{%- endmacro %}
{% macro field_error(name, errors) -%}
{% if errors.get(name) %}
<p class="field-error" id="{{ name }}-error">{{ errors[name] }}</p>{% endif %}
{%- endmacro %}
