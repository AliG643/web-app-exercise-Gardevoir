{% extends "base.html" %}

{% block title %}Messages | Gardevoir{% endblock %}

{% block content %}
  <h1>Messages</h1>

  {% for conversation in conversations %}
    <article>
      <h2>
        <a href="{{ url_for(
            'messages.conversation',
            conversation_id=conversation.id
        ) }}">
          {{ conversation.item_title }}
        </a>
      </h2>
    </article>
  {% else %}
    <p>You have no conversations yet.</p>
  {% endfor %}
{% endblock %}
